<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Form | CV Generator | By Nasr</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <nav>

        <div class="img">
            <img src="images/logo.png" alt="Logo">
            <h1 id="name">CVEngine</h1>
            <div></div>
        </div>
    </nav>

    <main>

  <div class="form-container">
    <div class="form-header">
      <h2>Resume Information Form</h2>
      <p>Apni saari details fill karke resume generate karein</p>
    </div>

    <form action="#" method="POST" enctype="multipart/form-data">
      
      <!-- Personal Details -->
      <div class="section-title">
        <i class="fa-solid fa-user"></i> Personal Details
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Shayan Ul Haq" required>
        </div>
        <div class="form-group">
          <label for="jobTitle">Job Title</label>
          <input type="text" id="jobTitle" placeholder="e.g. FRONT END DEVELOPER" required>
        </div>
        <div class="form-group full-width">
          <label for="profileImg">Profile Picture</label>
          <input type="file" id="profileImg" accept="image/*">
        </div>
        <div class="form-group full-width">
          <label for="shortTagline">Short Tagline / Subtitle</label>
          <input type="text" id="shortTagline" placeholder="e.g. Passionate about building modern web experiences.">
        </div>
      </div>

      <!-- Contact Information -->
      <div class="section-title">
        <i class="fa-solid fa-address-book"></i> Contact Information
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. 03131070322" required>
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="e.g. Karachi" required>
        </div>
        <div class="form-group full-width">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. shayanulhaq5555@gmail.com" required>
        </div>
      </div>

      <!-- Career Objective -->
      <div class="section-title">
        <i class="fa-solid fa-bullseye"></i> Career Objective
      </div>
      <div class="form-group">
        <label for="objective">Objective Statement</label>
        <textarea id="objective" placeholder="Write your career objective here..."></textarea>
      </div>

      <!-- Education -->
      <div class="section-title">
        <i class="fa-solid fa-graduation-cap"></i> Education
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="degree">Degree / Certificate Name</label>
          <input type="text" id="degree" placeholder="e.g. Matric">
        </div>
        <div class="form-group">
          <label for="status">Status</label>

          <select id="status">
            <option value="Completed">Completed</option>
            <option value="In Progress">In Progress</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="eduDesc">Education Description</label>
          <input type="text" id="eduDesc" placeholder="e.g. Secondary School Certificate (Matric)">
        </div>
      </div>

      <!-- Experience -->
      <div class="section-title">
        <i class="fa-solid fa-briefcase"></i> Experience
      </div>
      <div class="form-group">
        <label for="expTitle">Experience Title</label>
        <input type="text" id="expTitle" placeholder="e.g. Fresh / No Experience">
      </div>
      <div class="form-group">
        <label for="expDesc">Experience Description</label>
        <textarea id="expDesc" placeholder="Describe your experience or fresh status..."></textarea>
      </div>

      <!-- Technical Skills Selection -->
      <div class="section-title">
        <i class="fa-solid fa-code"></i> Technical Skills
      </div>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="skills" value="HTML" checked> HTML</label>
        <label class="checkbox-item"><input type="checkbox" name="skills" value="CSS" checked> CSS</label>
        <label class="checkbox-item"><input type="checkbox" name="skills" value="JavaScript" checked> JavaScript</label>
        <label class="checkbox-item"><input type="checkbox" name="skills" value="Supabase" checked> Supabase</label>
        <label class="checkbox-item"><input type="checkbox" name="skills" value="Bootstrap" checked> Bootstrap</label>
        <label class="checkbox-item"><input type="checkbox" name="skills" value="Git" checked> Git</label>
        <label class="checkbox-item"><input type="checkbox" name="skills" value="GitHub" checked> GitHub</label>
      </div>

      <!-- Custom Quote -->
      <div class="section-title">
        <i class="fa-solid fa-quote-left"></i> Custom Tagline / Quote
      </div>
      <div class="form-group">
        <label for="quote">Footer Quote</label>
        <input type="text" id="quote" placeholder="e.g. Better Code, Brighter Future">
      </div>

      <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Submit Details</button>
    </form>
  </div>

    </main>
    

    <footer>
        <div>
            <p>© 2026 Resume Template. All rights reserved.</p>
        </div>
        <div>
            <span>
                <a class="me" href="https://mail.google.com/mail/u/0/?to=shayanulhaq5555@gmail.com&fs=1&tf=cm" target="_blank">Let's Discuss Your Project</a>

            </span>
            <span>
                
                <a class="me" href="https://shayan-ul-haq-portfolio.vercel.app/" target="_blank">My Works (me)</a>
            </span>
        </div>
    </footer>



    

    
</body>
</html>
